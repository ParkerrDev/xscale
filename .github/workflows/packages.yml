name: packages
# xscale's Hyprland and Xwayland for the versions Arch has, and xscale's
# Hyprland for the one Omarchy builds itself on each of its channels: once a
# day, and whenever the patches or the recipes change. Each is built from the
# recipe pacman's version comes from (Arch's, or Omarchy's in omacom/omarchy-pkgs)
# with xscale's patch (`xscale recipe`), attested, and released as NAME-VERSION
# (NAME-omarchy-VERSION for Omarchy's recipe) with a SHA256SUMS, which is what
# `xscale install` downloads. A version already released is not built again; a
# channel whose Hyprland is Arch's builds nothing of its own.
on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
  push:
    branches: [master]
    paths: [patches/**, pkg/**, bin/xscale, .github/workflows/packages.yml]
permissions:
  contents: write
  id-token: write
  attestations: write
concurrency:
  group: packages
jobs:
  build:
    runs-on: ubuntu-latest
    container: archlinux:latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: xorg-xwayland
          - name: hyprland
          # an Omarchy machine on each channel, against that channel's
          # snapshot of Arch, so the build links what those machines have
          - { name: hyprland, channel: stable }
          - { name: hyprland, channel: rc }
          - { name: hyprland, channel: edge }
    env:
      GH_TOKEN: ${{ github.token }}
      NAME: ${{ matrix.name }}
      CHANNEL: ${{ matrix.channel }}
    steps:
      - name: Tools
        run: |
          pacman -Syu --noconfirm --needed git base-devel github-cli
          useradd -m builder
          install -d -o builder /tmp/out
      - uses: actions/checkout@v4
      - name: Omarchy channel
        if: env.CHANNEL != ''
        run: |
          pkg/omarchy-channel.sh "$CHANNEL"
          pacman -Syy
          # only a channel with a Hyprland of its own is built, and only then
          # is the container moved to that channel's snapshot of Arch, which
          # can be weeks older than the image (packages split since then
          # leave files a downgrade has to take over)
          if [ "$(LC_ALL=C pacman -Si "$NAME" | awk '/^Repository / { print $3; exit }')" = omarchy ]; then
            pacman -Suu --noconfirm --overwrite '*'
          fi
      - name: Recipe
        id: recipe
        run: |
          repo=$(LC_ALL=C pacman -Si "$NAME" | awk '/^Repository / { print $3; exit }')
          if [ -n "$CHANNEL" ] && [ "$repo" != omarchy ]; then
            echo "Omarchy's $CHANNEL channel takes $NAME from $repo: nothing of its own to build"
            echo "skip=yes" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          chown -R builder .
          version=$(su builder -c "bin/xscale recipe $NAME /tmp/recipe")
          echo "version=$version" >>"$GITHUB_OUTPUT"
          if [ "$repo" = omarchy ]; then
            echo "tag=$NAME-omarchy-$version" >>"$GITHUB_OUTPUT"
            echo "from=Omarchy's" >>"$GITHUB_OUTPUT"
          else
            echo "tag=$NAME-$version" >>"$GITHUB_OUTPUT"
            echo "from=Arch's" >>"$GITHUB_OUTPUT"
          fi
      - name: Released already?
        id: released
        if: steps.recipe.outputs.skip != 'yes'
        run: |
          if gh release view "${{ steps.recipe.outputs.tag }}" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Released already: ${{ steps.recipe.outputs.tag }}"
            echo "already=yes" >>"$GITHUB_OUTPUT"
          fi
      - name: Build
        if: steps.recipe.outputs.skip != 'yes' && steps.released.outputs.already != 'yes'
        working-directory: /tmp/recipe
        run: |
          su builder -c 'makepkg --printsrcinfo' |
            awk '$1 ~ /^(make|check)?depends$/ { print $3 }' | sed 's/[<>=].*//' |
            xargs pacman -S --noconfirm --needed --asdeps
          su builder -c 'GNUPGHOME=/tmp/recipe/.gnupg PKGDEST=/tmp/out makepkg --config "$GITHUB_WORKSPACE/pkg/makepkg.conf" --noconfirm'
          cd /tmp/out
          sha256sum -- *.pkg.tar.zst >SHA256SUMS
          cat SHA256SUMS
      - name: Attest
        if: steps.recipe.outputs.skip != 'yes' && steps.released.outputs.already != 'yes'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: /tmp/out/*.pkg.tar.zst
      - name: Release
        if: steps.recipe.outputs.skip != 'yes' && steps.released.outputs.already != 'yes'
        run: |
          version=${{ steps.recipe.outputs.version }}
          tag=${{ steps.recipe.outputs.tag }}
          from="${{ steps.recipe.outputs.from }}"
          # two channels can offer the same version: the first to finish releases it
          gh release create "$tag" /tmp/out/*.pkg.tar.zst /tmp/out/SHA256SUMS \
            -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest=false \
            --title "${tag%-"$version"} $version" \
            --notes "xscale's $NAME for $from $NAME ${version%.*}: $from own recipe with xscale's patch, built by the packages workflow. \`xscale install\` downloads it and checks it against SHA256SUMS. \`gh attestation verify FILE -R $GITHUB_REPOSITORY\` shows which run of this repository built it." ||
            gh release view "$tag" -R "$GITHUB_REPOSITORY" >/dev/null
