name: checks
# The scripts and the Lua, and whether both patches still go onto Arch's
# current recipes: each recipe is made as `xscale install` makes it, its
# sources fetched and checked (the Xwayland tarball's signature too), and the
# patch applied. makepkg will not run as root, so that part runs as a user of
# its own.
on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: "41 4 * * *"
jobs:
  checks:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Tools
        run: |
          pacman -Syu --noconfirm --needed git base-devel shellcheck lua python
          useradd -m builder
      - uses: actions/checkout@v4
      - name: Shell and Lua
        run: |
          shellcheck bin/xscale install.sh uninstall.sh hooks/post-update.sh session/uwsm-env pkg/omarchy-channel.sh tests/check.sh
          luac -p hypr/xscale.lua
          tests/hyprland-xwayland-reload.sh
          tests/check.sh
      - name: The patches still fit Arch's recipes
        run: |
          chown -R builder .
          for name in xorg-xwayland hyprland; do
            su builder -c "bin/xscale recipe $name /tmp/recipe-$name"
            su builder -c "cd /tmp/recipe-$name && GNUPGHOME=/tmp/recipe-$name/.gnupg makepkg --config \"$GITHUB_WORKSPACE/pkg/makepkg.conf\" --nobuild --nodeps"
          done
      - name: The Hyprland patch still fits Omarchy's own recipe (edge)
        run: |
          pkg/omarchy-channel.sh edge
          pacman -Syyuu --noconfirm
          if [ "$(LC_ALL=C pacman -Si hyprland | awk '/^Repository / { print $3; exit }')" = omarchy ]; then
            su builder -c "bin/xscale recipe hyprland /tmp/recipe-omarchy"
            su builder -c "cd /tmp/recipe-omarchy && GNUPGHOME=/tmp/recipe-omarchy/.gnupg makepkg --config \"$GITHUB_WORKSPACE/pkg/makepkg.conf\" --nobuild --nodeps"
          fi
