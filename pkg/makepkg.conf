# Keep Arch's build settings and signature verification. Retry interrupted HTTP
# transfers as well as HTTP error responses, with a bounded retry window.
source /etc/makepkg.conf
for i in "${!DLAGENTS[@]}"; do
  case ${DLAGENTS[i]} in
    http::*curl*|https::*curl*)
      DLAGENTS[i]+=' --retry-all-errors --connect-timeout 30 --max-time 900 --retry-max-time 180'
      ;;
  esac
done
unset i
